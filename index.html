<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  
  <title>jayunboxes | Tech Reviews, Curated Deals & Media Kit</title>
  <meta name="description" content="Minimalist tech reviews, curated gadget deals, media kit & stats, and 4K desk setup wallpapers by Jay.">
  <meta name="author" content="Jay">
  <meta name="theme-color" content="#fafaf9">

  <!-- Open Graph / Social Sharing -->
  <meta property="og:title" content="jayunboxes | Tech Reviews, Curated Deals & Media Kit">
  <meta property="og:description" content="Minimalist tech reviews, curated gadget deals, media kit & stats, and 4K desk setup wallpapers by Jay.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/feather-icons"></script>

  <style>
    /* =========================================================
       MINIMALIST WARM LIGHT PALETTE
    ========================================================= */
    :root {
      --bg: #fafaf9;
      --surface: #ffffff;
      --surface-subtle: #f5f5f4;
      --border: #e7e5e4;
      --border-strong: #d6d3d1;
      --text: #1c1917;
      --text-muted: #78716c;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --green: #16a34a;
      --green-soft: #f0fdf4;
      --radius: 16px;
      --radius-sm: 10px;
      --radius-pill: 9999px;
      --shadow: 0 4px 20px -2px rgba(28, 25, 23, 0.05);
      --shadow-hover: 0 10px 30px -4px rgba(28, 25, 23, 0.08);
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    body.modal-open {
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    .container {
      max-width: 840px;
      margin: 0 auto;
      padding: 40px 20px 100px;
    }

    /* =========================================================
       HEADER NAVIGATION TABS
    ========================================================= */
    .top-nav {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      padding: 6px 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      box-shadow: var(--shadow);
      width: fit-content;
      margin: 0 auto 36px;
      overflow-x: auto;
      max-width: 100%;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .top-nav::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s var(--ease);
      white-space: nowrap;
    }

    .tab-btn:hover {
      color: var(--text);
      background: var(--surface-subtle);
    }

    .tab-btn.active {
      color: var(--text);
      background: var(--surface-subtle);
      font-weight: 700;
    }

    /* =========================================================
       PAGE SWITCHING MECHANISM
    ========================================================= */
    .page-view {
      display: none;
      animation: fadeIn 0.3s var(--ease) forwards;
    }

    .page-view.active-page {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .page-header {
      margin-bottom: 28px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      margin-bottom: 16px;
      padding: 4px 0;
      transition: color 0.2s ease;
    }

    .back-btn:hover {
      color: var(--text);
    }

    .page-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .page-desc {
      color: var(--text-muted);
      font-size: 14.5px;
      margin-top: 4px;
    }

    /* =========================================================
       HOME / OVERVIEW VIEW
    ========================================================= */
    .profile-card {
      text-align: center;
      padding: 36px 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }

    .avatar-wrap {
      width: 104px;
      height: 104px;
      margin: 0 auto 18px;
      border-radius: 50%;
      padding: 3px;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }

    .profile-card h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .profile-handle {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      margin-top: 2px;
    }

    .profile-bio {
      color: var(--text-muted);
      font-size: 15px;
      max-width: 520px;
      margin: 12px auto 0;
      line-height: 1.6;
    }

    .social-strip {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 24px;
    }

    .social-btn {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      transition: all 0.22s var(--ease);
      box-shadow: var(--shadow);
    }

    .social-btn.btn-instagram {
      background: linear-gradient(135deg, rgba(254, 218, 117, 0.12), rgba(250, 126, 30, 0.12), rgba(214, 41, 118, 0.14), rgba(150, 47, 191, 0.14));
      border-color: rgba(225, 48, 108, 0.25);
      color: #d62976;
    }
    .social-btn.btn-instagram:hover {
      background: linear-gradient(135deg, #feda75, #fa7e1e, #d62976, #962fbf);
      color: #ffffff;
      border-color: transparent;
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 8px 20px rgba(214, 41, 118, 0.35);
    }

    .social-btn.btn-youtube {
      background: rgba(255, 0, 0, 0.08);
      border-color: rgba(255, 0, 0, 0.22);
      color: #ff0000;
    }
    .social-btn.btn-youtube:hover {
      background: #ff0000;
      color: #ffffff;
      border-color: transparent;
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 8px 20px rgba(255, 0, 0, 0.3);
    }

    .social-btn.btn-threads {
      background: #f5f5f4;
      border-color: rgba(0, 0, 0, 0.15);
      color: #111111;
    }
    .social-btn.btn-threads:hover {
      background: #111111;
      color: #ffffff;
      border-color: transparent;
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    .social-btn.btn-mail {
      background: rgba(37, 99, 235, 0.08);
      border-color: rgba(37, 99, 235, 0.22);
      color: #2563eb;
    }
    .social-btn.btn-mail:hover {
      background: #2563eb;
      color: #ffffff;
      border-color: transparent;
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
    }

    .directory-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .dir-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      cursor: pointer;
      text-align: left;
      box-shadow: var(--shadow);
      transition: all 0.25s var(--ease);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 130px;
    }

    .dir-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
      border-color: var(--border-strong);
    }

    .dir-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .dir-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
    }

    .dir-icon.ic-deals {
      background: rgba(245, 158, 11, 0.12);
      color: #d97706;
      border: 1px solid rgba(245, 158, 11, 0.2);
    }
    .dir-icon.ic-walls {
      background: rgba(147, 51, 234, 0.12);
      color: #9333ea;
      border: 1px solid rgba(147, 51, 234, 0.2);
    }
    .dir-icon.ic-tools {
      background: rgba(37, 99, 235, 0.12);
      color: #2563eb;
      border: 1px solid rgba(37, 99, 235, 0.2);
    }
    .dir-icon.ic-media {
      background: rgba(225, 48, 108, 0.12);
      color: #e1306c;
      border: 1px solid rgba(225, 48, 108, 0.2);
    }

    .dir-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .dir-sub {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .vip-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--green);
      border-radius: var(--radius);
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }

    .vip-info h3 {
      font-size: 15px;
      font-weight: 700;
    }

    .vip-info p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .btn-green {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--green);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25);
    }

    /* =========================================================
       TECH DEALS GRID
    ========================================================= */
    .deals-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .deal-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      transition: all 0.25s var(--ease);
    }

    .deal-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
      border-color: var(--border-strong);
    }

    .deal-img-wrap {
      position: relative;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      height: 200px;
    }

    .deal-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      transition: transform 0.4s var(--ease);
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.06));
    }

    .deal-card:hover .deal-img {
      transform: scale(1.05);
    }

    .deal-featured-tag {
      position: absolute;
      top: 10px;
      left: 10px;
      background: var(--text);
      color: #ffffff;
      padding: 3px 8px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      z-index: 2;
    }

    .deal-body {
      padding: 18px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .deal-meta-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }

    .deal-title {
      font-size: 14.5px;
      font-weight: 700;
      line-height: 1.45;
      min-height: 42px;
      margin-bottom: 12px;
    }

    .deal-price-line {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-top: auto;
    }

    .mrp {
      font-size: 12px;
      color: var(--text-muted);
      text-decoration: line-through;
    }

    .price {
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
    }

    .discount {
      font-size: 11px;
      font-weight: 700;
      color: var(--green);
      margin-top: 3px;
    }

    .btn-deal {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--text);
      color: #ffffff;
      padding: 10px;
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      font-weight: 700;
      margin-top: 14px;
      width: 100%;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .btn-deal:hover {
      opacity: 0.9;
    }

    /* =========================================================
       MEDIA KIT STYLES
    ========================================================= */
    .mediakit-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .mediakit-stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--shadow);
      text-align: left;
    }

    .mediakit-stat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .mediakit-stat-num {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: var(--text);
    }

    .mediakit-stat-label {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
      font-weight: 500;
    }

    .mediakit-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
    }

    .badge-ig { background: rgba(225, 48, 108, 0.1); color: #e1306c; }
    .badge-yt { background: rgba(255, 0, 0, 0.1); color: #ff0000; }
    .badge-reach { background: rgba(37, 99, 235, 0.1); color: #2563eb; }

    .mediakit-banner {
      background: linear-gradient(135deg, #1c1917, #292524);
      color: #ffffff;
      border-radius: var(--radius);
      padding: 28px 24px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .mediakit-banner h3 {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .mediakit-banner p {
      font-size: 13.5px;
      color: #d6d3d1;
      margin-top: 4px;
      max-width: 480px;
    }

    .btn-collab {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      color: #1c1917;
      padding: 12px 20px;
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      font-weight: 700;
      white-space: nowrap;
      transition: transform 0.2s ease;
    }

    .btn-collab:hover {
      transform: translateY(-2px);
    }

    .demo-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 2
