<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jayunboxes | Tech & Unboxings</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --heading: #f0f6fc;
      --accent: #58a6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 2rem 1rem;
    }
    .container { max-width: 680px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 2.5rem; }
    h1 { color: var(--heading); font-size: 2rem; margin-bottom: 0.25rem; }
    p.tagline { color: #8b949e; font-size: 1rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
    }
    h2 { color: var(--heading); font-size: 1.1rem; margin-bottom: 0.75rem; }
    .links a {
      display: block;
      background: #21262d;
      color: var(--accent);
      text-decoration: none;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 0.5rem;
      font-weight: 500;
      transition: background 0.2s;
    }
    .links a:hover { background: #30363d; }
    footer { text-align: center; color: #8b949e; font-size: 0.85rem; margin-top: 3rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>jayunboxes</h1>
      <p class="tagline">Tech Reviews • Unboxings • Setups</p>
    </header>

    <div class="card">
      <h2>Social & Channels</h2>
      <div class="links">
        <a href="https://instagram.com" target="_blank">Instagram (@jayunboxes)</a>
        <a href="https://youtube.com" target="_blank">YouTube Channel</a>
      </div>
    </div>

    <div class="card">
      <h2>Contact & Collabs</h2>
      <p style="font-size: 0.95rem;">For review units, business inquiries, or collaborations:</p>
      <div class="links" style="margin-top: 0.75rem;">
        <a href="mailto:your-email@example.com">Send an Email</a>
      </div>
    </div>

    <footer>
      <p>© 2026 jayunboxes. Hosted on GitHub Pages.</p>
    </footer>
  </div>
</body>
</html>
